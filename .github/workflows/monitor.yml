name: Tremor watch

# Runs src/monitor.py on a schedule -- the actual "recurring" part of
# recurring monitoring. No server, no hosting account, no cost: GitHub
# Actions' free tier covers a job this short running once a day many times
# over. See reports/HOSTING_RESULTS.md for the reasoning and the honest
# limits of this approach.

on:
  schedule:
    # 06:00 UTC daily. GitHub does not guarantee the exact minute on a busy
    # scheduler, but this is a monitor, not a stopwatch -- "checked once a
    # day, roughly this time" is the actual requirement.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets a human (or Tamer) trigger a check on demand from the Actions tab

permissions:
  contents: write  # needed to commit the updated state + findings back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the watch loop
        working-directory: .
        # monitor.py exits 1 when it finds a BREAKING change -- that's a
        # useful signal (a red X on this workflow run means "something
        # broke"), not a workflow failure to suppress. Left as the real
        # exit code; the commit step below still runs regardless via
        # `if: always()`.
        run: python3 src/monitor.py check

      - name: Commit updated state and findings
        if: always()
        run: |
          git config user.name "tremor-bot"
          git config user.email "tremor-bot@users.noreply.github.com"
          git add data/state reports/monitor_runs
          git diff --cached --quiet || git commit -m "Tremor watch: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
